<!-- Cookie Consent Banner -->
<style>
    .cookie-banner {
        position: fixed; bottom: 20px; left: 20px; right: 20px; z-index: 9999;
        display: flex; justify-content: space-between; align-items: center;
        padding: 1.5rem; gap: 1.5rem; border-radius: 16px;
        background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        color: var(--text-main); font-family: 'Cairo', sans-serif;
    }
    .cookie-banner p { margin: 0; font-size: 0.95rem; line-height: 1.5; }
    .cookie-banner a { color: var(--primary); text-decoration: underline; font-weight: bold; }
    .btn-cookie {
        background: var(--primary); color: white; border: none; padding: 0.8rem 2rem;
        border-radius: 12px; font-weight: bold; cursor: pointer; white-space: nowrap;
        transition: all 0.3s ease;
    }
    .btn-cookie:hover { background: #2563eb; transform: translateY(-2px); }
    @media (max-width: 768px) {
        .cookie-banner { flex-direction: column; text-align: center; padding: 1.2rem; bottom: 10px; left: 10px; right: 10px; }
        .btn-cookie { width: 100%; }
    }
</style>

<div id="cookieConsentBanner" class="cookie-banner hidden">
    <p>نحن نستخدم ملفات تعريف الارتباط (Cookies) لتحسين تجربتك في الموقع وتحليل الزيارات. باستمرارك في التصفح، فأنت توافق على استخدامنا لها وفقاً لـ <a href="{base}/privacy.html">سياسة الخصوصية</a>.</p>
    <button id="acceptCookiesBtn" class="btn-cookie">موافق (Accept)</button>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const banner = document.getElementById('cookieConsentBanner');
        const acceptBtn = document.getElementById('acceptCookiesBtn');
        
        if (!localStorage.getItem('cookieConsent')) {
            banner.classList.remove('hidden');
        }
        
        acceptBtn.addEventListener('click', function() {
            localStorage.setItem('cookieConsent', 'accepted');
            banner.classList.add('hidden');
        });
    });
</script>
